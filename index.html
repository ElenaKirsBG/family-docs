// --- INDEXED DB ENGINE ---
const DB_NAME = 'FamilyVaultDB';
const DB_VERSION = 1;
const initDB = () => {
return new Promise((resolve, reject) => {
const request = indexedDB.open(DB_NAME, DB_VERSION);
request.onerror = () => reject('DB Open Error');
request.onsuccess = () => resolve(request.result);
request.onupgradeneeded = (e) => {
const db = e.target.result;
if (!db.objectStoreNames.contains('members')) {
db.createObjectStore('members', { keyPath: 'id' });
}
if (!db.objectStoreNames.contains('documents')) {
db.createObjectStore('documents', { keyPath: 'id' });
}
};
});
};
const dbOp = async (storeName, mode, callback) => {
const db = await initDB();
return new Promise((resolve, reject) => {
const tx = db.transaction(storeName, mode);
const store = tx.objectStore(storeName);
const request = callback(store);
tx.oncomplete = () => resolve(request ? request.result : true);
tx.onerror = () => reject(tx.error);
});
};
// --- WEBCRYPTO ENCRYPTION ---
async function getKey(password, salt) {
const enc = new TextEncoder();
const keyMaterial = await window.crypto.subtle.importKey(
"raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
);
return window.crypto.subtle.deriveKey(
{ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
keyMaterial,
{ name: "AES-GCM", length: 256 },
false,
["encrypt", "decrypt"]
);
}
async function encryptData(dataString, password) {
const enc = new TextEncoder();
const salt = window.crypto.getRandomValues(new Uint8Array(16));
const iv = window.crypto.getRandomValues(new Uint8Array(12));
const key = await getKey(password, salt);
const encrypted = await window.crypto.subtle.encrypt(
{ name: "AES-GCM", iv },
key,
enc.encode(dataString)
);
const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
combined.set(salt, 0);
combined.set(iv, salt.length);
combined.set(new Uint8Array(encrypted), salt.length + iv.length);
return btoa(String.fromCharCode.apply(null, combined));
}
async function decryptData(encryptedBase64, password) {
try {
const combinedStr = atob(encryptedBase64);
const combined = new Uint8Array(combinedStr.length);
for (let i = 0; i < combinedStr.length; i++) combined[i] = combinedStr.charCodeAt(i);
const salt = combined.slice(0, 16);
const iv = combined.slice(16, 28);
const data = combined.slice(28);
const key = await getKey(password, salt);
const decrypted = await window.crypto.subtle.decrypt(
{ name: "AES-GCM", iv },
key,
data
);
return new TextDecoder().decode(decrypted);
} catch (err) {
throw new Error('Неверный пароль или поврежденный файл');
}
}
// --- OPTIMIZE IMAGE RESOLUTION FOR DB STORAGE ---
const compressImage = (fileOrBase64, maxWidth = 1200, quality = 0.8) => {
return new Promise((resolve) => {
const img = new Image();
img.onload = () => {
let w = img.width;
let h = img.height;
if (w > maxWidth) {
h = Math.round((h * maxWidth) / w);
w = maxWidth;
}
const canvas = document.createElement('canvas');
canvas.width = w;
canvas.height = h;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, w, h);
resolve(canvas.toDataURL('image/jpeg', quality));
};
if (typeof fileOrBase64 === 'string') {
img.src = fileOrBase64;
} else {
const reader = new FileReader();
reader.onload = (e) => { img.src = e.target.result; };
reader.readAsDataURL(fileOrBase64);
}
});
};

await dbOp('members', 'readwrite', s => s.put(m));

for (const d of userDocs) {
await dbOp('documents', 'readwrite', s => s.delete(d.id));

await loadDatabase();
setIsMemberModalOpen(false);
showToast('Профиль удален');
}

title: ⁠Страница ${nextIndex}⁠,

}]);

// Backup Operations
const handleExportBackup = async (password) => {
try {
const allMembers = await dbOp('members', 'readonly', s => s.getAll());
const allDocs = await dbOp('documents', 'readonly', s => s.getAll());
const backupObj = {
version: 1,
createdAt: new Date().toISOString(),
members: allMembers,
documents: allDocs
};
const rawJson = JSON.stringify(backupObj);
let content = rawJson;
let filename = ⁠family_vault_backup_${new Date().toISOString().slice(0,10)}.json⁠;
if (password && password.trim()) {
content = await encryptData(rawJson, password.trim());
filename = ⁠encrypted_${filename}⁠;
}
const blob = new Blob([content], { type: 'application/json' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = filename;
a.click();
URL.revokeObjectURL(url);
showToast('Бэкап скачан!', 'success');
setIsBackupModalOpen(false);
} catch (err) {
showToast('Ошибка экспорта', 'error');
}
};
const handleImportBackup = async (file, password) => {
try {
const text = await file.text();
let jsonStr = text;
if (!text.trim().startsWith('{')) {
if (!password) {
showToast('Введите пароль от бэкапа!', 'error');
return;
}
jsonStr = await decryptData(text, password);
}
const parsed = JSON.parse(jsonStr);
if (!parsed.members || !parsed.documents) {
throw new Error('Формат файла не поддерживается');
}
if (confirm('Импортировать? Данные будут добавлены в приложение.')) {
for (const m of parsed.members) {
await dbOp('members', 'readwrite', s => s.put(m));
}
for (const d of parsed.documents) {
await dbOp('documents', 'readwrite', s => s.put(d));
}
await loadDatabase();
showToast('Данные импортированы!');
setIsBackupModalOpen(false);
}
} catch (err) {
showToast(err.message || 'Ошибка чтения бэкапа', 'error');
}
};

return matchName || matchFields;
}
return true;
});

// --- CROPPER MODAL COMPONENT WITH BOX OVERLAY ---
function CropperModal({ imageSrc, onCancel, onSave }) {
const [rotation, setRotation] = useState(0);
const [contrast, setContrast] = useState(100);
const [brightness, setBrightness] = useState(100);
const [isBW, setIsBW] = useState(false);
const [crop, setCrop] = useState({ x: 10, y: 10, width: 80, height: 80 });
const canvasRef = useRef(null);
const imgRef = useRef(null);
useEffect(() => {
renderCanvas();
}, [rotation, contrast, brightness, isBW, imageSrc]);
const renderCanvas = () => {
const canvas = canvasRef.current;
if (!canvas) return;
const ctx = canvas.getContext('2d');
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
imgRef.current = img;
let w = img.width;
let h = img.height;
if (rotation % 180 !== 0) {
canvas.width = h;
canvas.height = w;
} else {
canvas.width = w;
canvas.height = h;
}
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.save();
ctx.translate(canvas.width / 2, canvas.height / 2);
ctx.rotate((rotation * Math.PI) / 180);
ctx.filter = ⁠contrast(${contrast}%) brightness(${brightness}%) ${isBW ? 'grayscale(100%)' : ''}⁠;
ctx.drawImage(img, -w / 2, -h / 2);
ctx.restore();
};
img.src = imageSrc;
};
const handleConfirm = () => {
const canvas = canvasRef.current;
if (!canvas) return;
const cropX = (crop.x / 100) * canvas.width;
const cropY = (crop.y / 100) * canvas.height;
const cropW = (crop.width / 100) * canvas.width;
const cropH = (crop.height / 100) * canvas.height;
const croppedCanvas = document.createElement('canvas');
croppedCanvas.width = Math.max(cropW, 50);
croppedCanvas.height = Math.max(cropH, 50);
const ctx = croppedCanvas.getContext('2d');
ctx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, croppedCanvas.width, croppedCanvas.height);
onSave(croppedCanvas.toDataURL('image/jpeg', 0.85));
};
return (
<div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex flex-col p-4 select-none">
<div className="flex justify-between items-center text-white mb-2">
<h3 className="font-bold text-sm">Кадрирование и фильтры</h3>
<button onClick={onCancel} className="p-1.5 text-slate-400 hover:text-white bg-slate-800 rounded-xl">✕</button>
</div>
<div className="flex-1 relative flex items-center justify-center overflow-hidden my-2 bg-slate-900 rounded-2xl border border-slate-800 p-2">
<canvas ref={canvasRef} className="max-h-full max-w-full object-contain rounded shadow-2xl" />
</div>
<div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-3">
<div className="flex flex-wrap items-center justify-between gap-2 text-xs">
<button onClick={() => setRotation(r => (r + 90) % 360)} className="px-3 py-1.5 bg-slate-800 text-slate-200 rounded-xl">Повернуть 90°</button>
<button onClick={() => setIsBW(b => !b)} className={⁠px-3 py-1.5 rounded-xl border ${isBW ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300'}⁠}>Ч/Б Скан</button>
</div>
<div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
<button onClick={onCancel} className="px-4 py-1.5 text-xs text-slate-400">Отмена</button>
<button onClick={handleConfirm} className="px-5 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow">Сохранить фото</button>
</div>
</div>
</div>
);
}
