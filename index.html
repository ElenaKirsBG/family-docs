<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный Архив Документов</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & ReactDOM (Production CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for parsing JSX directly in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbars & Mobile Optimizations */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 3px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

<body class="h-full font-sans antialiased bg-slate-950 text-slate-100 overflow-hidden select-none">

  <!-- React Root Container -->
  <div id="root" class="h-full w-full"></div>

  <!-- APPLICATION SCRIPT (React + JSX) -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- INDEXED DB STORAGE ENGINE ---
    const DB_NAME = 'FamilyVaultDB_v2';
    const DB_VERSION = 1;

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject('Failed to open database');
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('members')) {
            db.createObjectStore('members', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('documents')) {
            db.createObjectStore('documents', { keyPath: 'id' });
          }
        };
      });
    };

    const dbOp = async (storeName, mode, callback) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        const request = callback(store);
        tx.oncomplete = () => resolve(request ? request.result : true);
        tx.onerror = () => reject(tx.error);
      });
    };

    // --- WEBCRYPTO ENCRYPTION HELPERS FOR BACKUPS ---
    async function getKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(dataString, password) {
      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const key = await getKey(password, salt);
      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(dataString)
      );
      
      const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(encrypted), salt.length + iv.length);
      
      return btoa(String.fromCharCode.apply(null, combined));
    }

    async function decryptData(encryptedBase64, password) {
      try {
        const combinedStr = atob(encryptedBase64);
        const combined = new Uint8Array(combinedStr.length);
        for (let i = 0; i < combinedStr.length; i++) combined[i] = combinedStr.charCodeAt(i);
        
        const salt = combined.slice(0, 16);
        const iv = combined.slice(16, 28);
        const data = combined.slice(28);
        
        const key = await getKey(password, salt);
        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          data
        );
        return new TextDecoder().decode(decrypted);
      } catch (err) {
        throw new Error('Неверный пароль или поврежденный файл!');
      }
    }

    // --- DOCUMENT TEMPLATES CONFIG ---
    const DOC_TEMPLATES = {
      passport_rf: {
        name: 'Российский паспорт',
        category: 'Паспорта',
        icon: 'fa-id-card',
        fields: [
          { id: 'series_num', label: 'Серия и Номер', placeholder: '1234 567890', req: true },
          { id: 'issue_date', label: 'Дата выдачи', type: 'date' },
          { id: 'issuer_code', label: 'Код подразделения', placeholder: '770-001' },
          { id: 'issuer', label: 'Кем выдан', placeholder: 'ГУ МВД по г. Москве' },
          { id: 'birth_place', label: 'Место рождения' },
          { id: 'registration', label: 'Адрес регистрации (прописка)' }
        ]
      },
      passport_zagran: {
        name: 'Заграничный паспорт',
        category: 'Паспорта',
        icon: 'fa-plane-departure',
        fields: [
          { id: 'number', label: 'Серия и Номер', placeholder: '75 1234567', req: true },
          { id: 'latin_name', label: 'ФИО (Латиницей)', placeholder: 'IVANOV IVAN' },
          { id: 'issue_date', label: 'Дата выдачи', type: 'date' },
          { id: 'expiry_date', label: 'Срок действия', type: 'date' },
          { id: 'issuer', label: 'Орган выдачи', placeholder: 'МВД 77001' }
        ]
      },
      snils: {
        name: 'СНИЛС',
        category: 'Личные',
        icon: 'fa-address-card',
        fields: [
          { id: 'number', label: 'Номер СНИЛС', placeholder: '123-456-789 00', req: true }
        ]
      },
      inn: {
        name: 'ИНН',
        category: 'Личные',
        icon: 'fa-file-invoice-dollar',
        fields: [
          { id: 'number', label: 'Номер ИНН', placeholder: '771234567890', req: true }
        ]
      },
      driver_rf: {
        name: 'Водительское удостоверение (РФ)',
        category: 'Транспорт',
        icon: 'fa-id-badge',
        fields: [
          { id: 'number', label: 'Серия и Номер', placeholder: '99 12 345678', req: true },
          { id: 'categories', label: 'Категории', placeholder: 'B, B1, M' },
          { id: 'issue_date', label: 'Дата выдачи', type: 'date' },
          { id: 'expiry_date', label: 'Действителен до', type: 'date' }
        ]
      },
      driver_int: {
        name: 'Международное в/у (IDP)',
        category: 'Транспорт',
        icon: 'fa-globe',
        fields: [
          { id: 'number', label: 'Номер МВУ', placeholder: '99 00 123456', req: true },
          { id: 'issue_date', label: 'Дата выдачи', type: 'date' },
          { id: 'expiry_date', label: 'Действителен до', type: 'date' }
        ]
      },
      marriage_cert: {
        name: 'Свидетельство о браке',
        category: 'Семья',
        icon: 'fa-ring',
        fields: [
          { id: 'act_num', label: 'Номер записи акта', placeholder: '12345' },
          { id: 'blank_num', label: 'Серия и номер бланка', placeholder: 'I-МЮ № 654321' },
          { id: 'date', label: 'Дата заключения брака', type: 'date' },
          { id: 'spouse_name', label: 'ФИО Супруга(и)' }
        ]
      },
      birth_cert: {
        name: 'Свидетельство о рождении ребенка',
        category: 'Семья',
        icon: 'fa-baby',
        fields: [
          { id: 'act_num', label: 'Номер записи акта', placeholder: '789' },
          { id: 'blank_num', label: 'Серия и номер бланка', placeholder: 'II-МЮ № 123456' },
          { id: 'child_name', label: 'ФИО Ребенка', placeholder: 'Иванов Александр' },
          { id: 'birth_date', label: 'Дата рождения', type: 'date' }
        ]
      },
      custom: {
        name: 'Другой документ',
        category: 'Прочее',
        icon: 'fa-folder-open',
        fields: [
          { id: 'doc_num', label: 'Номер / Реквизит', placeholder: '№ документа' },
          { id: 'note', label: 'Примечание / Описание' }
        ]
      }
    };

    const DEFAULT_MEMBERS = [
      { id: 'm_1', name: 'Я (Основной)', role: 'Владелец', color: 'bg-blue-600' },
      { id: 'm_2', name: 'Муж / Супруг', role: 'Семья', color: 'bg-indigo-600' }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [members, setMembers] = useState([]);
      const [documents, setDocuments] = useState([]);
      const [activeMemberId, setActiveMemberId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Все');
      
      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [editingMember, setEditingMember] = useState(null);
      const [isDocModalOpen, setIsDocModalOpen] = useState(false);
      const [editingDoc, setEditingDoc] = useState(null);
      const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);
      
      const [cropperSrc, setCropperSrc] = useState(null);
      const [cropperTargetScanId, setCropperTargetScanId] = useState(null);
      const [tempScans, setTempScans] = useState([]);
      const [viewerDocScans, setViewerDocScans] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      useEffect(() => {
        loadDatabase();
      }, []);

      const loadDatabase = async () => {
        try {
          let storedMembers = await dbOp('members', 'readonly', s => s.getAll());
          if (!storedMembers || storedMembers.length === 0) {
            for (const m of DEFAULT_MEMBERS) {
              await dbOp('members', 'readwrite', s => s.put(m));
            }
            storedMembers = DEFAULT_MEMBERS;
          }
          setMembers(storedMembers);
          if (!activeMemberId && storedMembers.length > 0) {
            setActiveMemberId(storedMembers[0].id);
          }

          const storedDocs = await dbOp('documents', 'readonly', s => s.getAll());
          setDocuments(storedDocs || []);
        } catch (err) {
          console.error("DB Error:", err);
          showToast("Ошибка базы данных", "error");
        }
      };

      const showToast = (message, type = 'info') => {
        setToastMsg({ message, type });
        setTimeout(() => setToastMsg(null), 3000);
      };

      const copyToClipboard = (text) => {
        if (!text) return;
        const input = document.createElement('textarea');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast(`Скопировано: ${text}`);
      };

      const handleSaveMember = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const memberObj = {
          id: editingMember?.id || `m_${Date.now()}`,
          name: formData.get('name'),
          role: formData.get('role'),
          color: formData.get('color') || 'bg-blue-600'
        };

        await dbOp('members', 'readwrite', s => s.put(memberObj));
        await loadDatabase();
        setIsMemberModalOpen(false);
        setEditingMember(null);
        showToast('Профиль сохранен!');
      };

      const handleDeleteMember = async (id) => {
        if (members.length <= 1) {
          showToast('Нельзя удалить последний профиль!', 'error');
          return;
        }
        if (confirm('Вы уверены? Документы этого человека будут удалены.')) {
          await dbOp('members', 'readwrite', s => s.delete(id));
          const userDocs = documents.filter(d => d.memberId === id);
          for (const d of userDocs) {
            await dbOp('documents', 'readwrite', s => s.delete(d.id));
          }
          setActiveMemberId(members.find(m => m.id !== id).id);
          await loadDatabase();
          setIsMemberModalOpen(false);
          showToast('Профиль удален');
        }
      };

      const handleOpenNewDoc = () => {
        setEditingDoc(null);
        setTempScans([]);
        setIsDocModalOpen(true);
      };

      const handleOpenEditDoc = (docItem) => {
        setEditingDoc(docItem);
        setTempScans(docItem.scans || []);
        setIsDocModalOpen(true);
      };

      const handleDeleteDoc = async (docId) => {
        if (confirm('Удалить этот документ из архива?')) {
          await dbOp('documents', 'readwrite', s => s.delete(docId));
          await loadDatabase();
          setIsDocModalOpen(false);
          showToast('Документ удален');
        }
      };

      const handleSaveDoc = async (e) => {
        e.preventDefault();
        const form = e.target;
        const typeKey = form.elements['doc_type'].value;
        const tmpl = DOC_TEMPLATES[typeKey];

        const fields = {};
        if (tmpl && tmpl.fields) {
          tmpl.fields.forEach(f => {
            fields[f.id] = form.elements[`field_${f.id}`]?.value || '';
          });
        }

        const docObj = {
          id: editingDoc?.id || `doc_${Date.now()}`,
          memberId: activeMemberId,
          type: typeKey,
          customTitle: form.elements['custom_title']?.value || '',
          fields,
          scans: tempScans,
          expiryDate: form.elements['expiry_date']?.value || '',
          hasExpiry: form.elements['has_expiry']?.checked || false,
          updatedAt: new Date().toISOString()
        };

        await dbOp('documents', 'readwrite', s => s.put(docObj));
        await loadDatabase();
        setIsDocModalOpen(false);
        showToast('Документ сохранен!');
      };

      const handleFileSelect = (e, scanIdToReplace = null) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        
        const file = files[0];
        const reader = new FileReader();
        reader.onload = (evt) => {
          // Оптимизация и сжатие снимка с камеры перед отправкой в редактор
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            const maxDim = 1600; // Оптимальный размер для скана документа
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.8);
            
            setCropperTargetScanId(scanIdToReplace);
            setCropperSrc(optimizedBase64);
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const handleSaveCrop = (croppedBase64) => {
        if (cropperTargetScanId) {
          setTempScans(prev => prev.map(s => s.id === cropperTargetScanId ? { ...s, data: croppedBase64 } : s));
        } else {
          const nextIndex = tempScans.length + 1;
          setTempScans(prev => [...prev, {
            id: `scan_${Date.now()}_${Math.random().toString(36).substr(2,4)}`,
            title: `Страница ${nextIndex}`,
            data: croppedBase64
          }]);
        }
        setCropperSrc(null);
        setCropperTargetScanId(null);
        showToast('Страница добавлена');
      };

      const handleExportBackup = async (password) => {
        try {
          const allMembers = await dbOp('members', 'readonly', s => s.getAll());
          const allDocs = await dbOp('documents', 'readonly', s => s.getAll());

          const backupData = {
            version: 1,
            createdAt: new Date().toISOString(),
            members: allMembers,
            documents: allDocs
          };

          const rawJson = JSON.stringify(backupData);
          let fileContent = rawJson;
          let fileName = `family_vault_backup_${new Date().toISOString().slice(0,10)}.json`;

          if (password && password.trim()) {
            fileContent = await encryptData(rawJson, password.trim());
            fileName = `encrypted_${fileName}`;
          }

          const blob = new Blob([fileContent], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          a.click();
          URL.revokeObjectURL(url);

          showToast('Резервная копия скачана!');
          setIsBackupModalOpen(false);
        } catch (err) {
          showToast('Ошибка при экспорте', 'error');
        }
      };

      const handleImportBackup = async (file, password) => {
        try {
          const text = await file.text();
          let jsonStr = text;

          if (!text.trim().startsWith('{')) {
            if (!password) {
              showToast('Введи пароль от бэкапа!', 'error');
              return;
            }
            jsonStr = await decryptData(text, password);
          }

          const parsed = JSON.parse(jsonStr);
          if (!parsed.members || !parsed.documents) {
            throw new Error('Неверный формат бэкапа');
          }

          if (confirm('Импортировать данные? Новые записи объединятся с существующими.')) {
            for (const m of parsed.members) {
              await dbOp('members', 'readwrite', s => s.put(m));
            }
            for (const d of parsed.documents) {
              await dbOp('documents', 'readwrite', s => s.put(d));
            }
            await loadDatabase();
            showToast('Данные успешно загружены!');
            setIsBackupModalOpen(false);
          }
        } catch (err) {
          showToast(err.message || 'Ошибка импорта', 'error');
        }
      };

      const activeMember = members.find(m => m.id === activeMemberId) || members[0];
      const categories = ['Все', 'Паспорта', 'Личные', 'Транспорт', 'Семья', 'Прочее'];

      const filteredDocs = documents.filter(d => {
        if (d.memberId !== activeMemberId) return false;
        const tmpl = DOC_TEMPLATES[d.type] || DOC_TEMPLATES.custom;
        if (selectedCategory !== 'Все' && tmpl.category !== selectedCategory) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchName = tmpl.name.toLowerCase().includes(q) || (d.customTitle && d.customTitle.toLowerCase().includes(q));
          const matchFields = Object.values(d.fields || {}).some(v => String(v).toLowerCase().includes(q));
          return matchName || matchFields;
        }
        return true;
      });

      return (
        <div className="flex flex-col md:flex-row h-full w-full bg-slate-950 text-slate-100 overflow-hidden">
          
          {toastMsg && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-2 border transition-all ${
              toastMsg.type === 'error' ? 'bg-rose-600 border-rose-500 text-white' : 'bg-blue-600 border-blue-500 text-white'
            }`}>
              <i className={`fa-solid ${toastMsg.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'}`}></i>
              {toastMsg.message}
            </div>
          )}

          {/* SIDEBAR MEMBERS */}
          <aside className="w-full md:w-72 lg:w-80 bg-slate-900/80 border-r border-slate-800 flex flex-col shrink-0">
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-lg">
                  <i className="fa-solid fa-shield-halved text-lg"></i>
                </div>
                <div>
                  <h1 className="font-bold text-slate-100 text-sm">Семейный Архив</h1>
                  <p className="text-[10px] text-slate-400">Хранение на устройстве</p>
                </div>
              </div>
              <button 
                onClick={() => setIsBackupModalOpen(true)}
                className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"
                title="Экспорт / Импорт"
              >
                <i className="fa-solid fa-arrows-rotate"></i>
              </button>
            </div>

            <div className="p-3 flex-1 overflow-y-auto space-y-1">
              <div className="flex justify-between items-center px-2 mb-2">
                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500">Члены семьи</span>
                <button 
                  onClick={() => { setEditingMember(null); setIsMemberModalOpen(true); }} 
                  className="text-xs text-blue-400 hover:text-blue-300 font-semibold flex items-center gap-1"
                >
                  <i className="fa-solid fa-plus"></i> Добавить
                </button>
              </div>

              {members.map(m => {
                const count = documents.filter(d => d.memberId === m.id).length;
                const isActive = m.id === activeMemberId;

                return (
                  <div 
                    key={m.id}
                    onClick={() => setActiveMemberId(m.id)}
                    className={`p-3 rounded-2xl flex items-center justify-between cursor-pointer transition border ${
                      isActive 
                        ? 'bg-slate-800 border-slate-700 text-white shadow-lg' 
                        : 'bg-transparent border-transparent text-slate-400 hover:bg-slate-800/40 hover:text-slate-200'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <div className={`w-9 h-9 rounded-xl ${m.color || 'bg-blue-600'} flex items-center justify-center text-xs font-bold text-white shadow-md`}>
                        {m.name.charAt(0).toUpperCase()}
                      </div>
                      <div>
                        <div className="text-xs font-semibold text-slate-100">{m.name}</div>
                        <div className="text-[10px] text-slate-400">{m.role}</div>
                      </div>
                    </div>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${isActive ? 'bg-blue-500/20 text-blue-300' : 'bg-slate-800 text-slate-500'}`}>
                      {count}
                    </span>
                  </div>
                );
              })}
            </div>

            <div className="p-3 border-t border-slate-800 text-[10px] text-slate-500 bg-slate-950 flex items-center justify-between">
              <span className="flex items-center gap-1 text-emerald-400 font-medium">
                <i className="fa-solid fa-lock"></i> 100% Локально
              </span>
              <span>IndexedDB</span>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 flex flex-col h-full overflow-hidden bg-slate-950">
            <header className="p-4 border-b border-slate-800/80 bg-slate-900/40 flex flex-col sm:flex-row gap-3 justify-between items-center shrink-0">
              <div className="flex items-center gap-3 w-full sm:w-auto">
                <div className={`w-10 h-10 rounded-2xl ${activeMember?.color || 'bg-blue-600'} flex items-center justify-center font-bold text-white shadow-md`}>
                  {activeMember?.name?.charAt(0).toUpperCase()}
                </div>
                <div>
                  <h2 className="text-base font-bold text-slate-100">{activeMember?.name}</h2>
                  <p className="text-xs text-slate-400">{activeMember?.role || 'Документы'}</p>
                </div>
                <button 
                  onClick={() => { setEditingMember(activeMember); setIsMemberModalOpen(true); }}
                  className="p-1.5 text-slate-400 hover:text-white bg-slate-800/60 rounded-xl ml-2"
                >
                  <i className="fa-solid fa-pen text-xs"></i>
                </button>
              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto">
                <div className="relative flex-1 sm:w-64">
                  <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                  <input 
                    type="text" 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Поиск по документам..." 
                    className="w-full pl-9 pr-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500"
                  />
                </div>

                <button 
                  onClick={handleOpenNewDoc}
                  className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5 whitespace-nowrap transition"
                >
                  <i className="fa-solid fa-plus"></i> Добавить документ
                </button>
              </div>
            </header>

            <div className="flex-1 p-4 md:p-6 overflow-y-auto space-y-4">
              <div className="flex gap-2 overflow-x-auto pb-1 text-xs font-medium no-scrollbar">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3.5 py-1.5 rounded-xl whitespace-nowrap transition border ${
                      selectedCategory === cat 
                        ? 'bg-blue-600 border-blue-500 text-white shadow-md' 
                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filteredDocs.map(docItem => {
                  const tmpl = DOC_TEMPLATES[docItem.type] || DOC_TEMPLATES.custom;
                  const docTitle = docItem.type === 'custom' ? docItem.customTitle || tmpl.name : tmpl.name;

                  return (
                    <div 
                      key={docItem.id}
                      className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition shadow-xl group"
                    >
                      <div>
                        <div className="flex justify-between items-start mb-3">
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center text-blue-400 shadow-inner">
                              <i className={`fa-solid ${tmpl.icon} text-lg`}></i>
                            </div>
                            <div>
                              <h3 className="font-bold text-slate-100 text-sm leading-snug">{docTitle}</h3>
                              <span className="text-[10px] text-slate-500">{tmpl.category}</span>
                            </div>
                          </div>
                          <button 
                            onClick={() => handleOpenEditDoc(docItem)}
                            className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition"
                          >
                            <i className="fa-solid fa-pen-to-square text-xs"></i>
                          </button>
                        </div>

                        <div className="space-y-1 mt-3">
                          {Object.entries(docItem.fields || {}).map(([key, val]) => {
                            if (!val) return null;
                            const fieldConfig = tmpl.fields?.find(f => f.id === key);
                            const label = fieldConfig ? fieldConfig.label : key;

                            return (
                              <div key={key} className="flex justify-between items-center py-1 border-b border-slate-800/40 last:border-none group/field">
                                <div className="truncate pr-2">
                                  <span className="text-[10px] text-slate-500 uppercase font-medium block">{label}</span>
                                  <span className="text-xs font-mono text-slate-200 font-medium truncate block">{val}</span>
                                </div>
                                <button 
                                  onClick={() => copyToClipboard(val)}
                                  className="p-1 text-slate-500 hover:text-blue-400 hover:bg-slate-800 rounded transition opacity-80 sm:opacity-0 group-hover/field:opacity-100"
                                  title="Копировать"
                                >
                                  <i className="fa-solid fa-copy text-xs"></i>
                                </button>
                              </div>
                            );
                          })}

                        <div className="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between">

                            <i className="fa-solid fa-layer-group text-blue-400"></i> Страниц: {docItem.scans.length}
                          </span>

                                key={scan.id || idx}

            <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col p-4">
              <div className="flex justify-between items-center text-white mb-2">
                <div>
                  <h3 className="text-sm font-bold text-slate-100">{viewerDocScans.title}</h3>
                  <p className="text-[11px] text-slate-400">
                    {viewerDocScans.scans[viewerDocScans.index]?.title || `Страница ${viewerDocScans.index + 1}`} ({viewerDocScans.index + 1} из {viewerDocScans.scans.length})

                    href={viewerDocScans.scans[viewerDocScans.index]?.data}

                    <select

                      onChange={(e) => setEditingDoc(prev => prev ? {...prev, type: e.target.value} : { type: e.target.value })}

                  {editingDoc?.type === 'custom' && (
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Название документа *</label>
                      <input 
                        type="text" 
                        name="custom_title"
                        defaultValue={editingDoc?.customTitle || ''}
                        placeholder="например, Свидетельство об имуществе"
                        className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  )}

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 border-t border-slate-800/60">
                    {((DOC_TEMPLATES[editingDoc?.type || 'passport_rf'] || DOC_TEMPLATES.custom).fields).map(f => (
                      <div key={f.id}>
                        <label className="block text-xs font-medium text-slate-400 mb-1">{f.label}</label>
                        <input 
                          type={f.type || 'text'}
                          name={`field_${f.id}`}
                          defaultValue={editingDoc?.fields?.[f.id] || ''}
                          placeholder={f.placeholder || ''}
                          className="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500 font-mono"
                        />
                      </div>
                    ))}
                  </div>

                  {/* MULTI-PAGE SCAN ATTACHMENT */}
                  <div className="pt-4 border-t border-slate-800/60">
                    <div className="flex justify-between items-center mb-3">
                      <div>
                        <label className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                          <i className="fa-solid fa-layer-group text-blue-400"></i> Сканы / Страницы ({tempScans.length})
                        </label>
                        <p className="text-[10px] text-slate-400">Сделайте фото нескольких страниц или загрузите файлы</p>
                      </div>
                      
                      <label className="cursor-pointer px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium flex items-center gap-1.5 shadow-md transition">
                        <i className="fa-solid fa-camera"></i> + Скан страницы
                        <input type="file" accept="image/*" capture="environment" onChange={(e) => handleFileSelect(e)} className="hidden" />
                      </label>
                    </div>

                    <div className="space-y-2">
                      {tempScans.map((scan, idx) => (
                        <div key={scan.id || idx} className="flex items-center gap-3 p-2.5 bg-slate-950 border border-slate-800 rounded-2xl">
                          <div className="w-14 h-14 rounded-xl border border-slate-800 bg-slate-900 overflow-hidden shrink-0 relative">
                            <img src={scan.data} className="w-full h-full object-cover" />
                            <span className="absolute bottom-0 left-0 right-0 bg-slate-950/80 text-[9px] text-center text-slate-300 py-0.5 font-mono">
                              #{idx + 1}
                            </span>
                          </div>

                          <div className="flex-1">
                            <input 
                              type="text" 
                              value={scan.title || `Страница ${idx + 1}`} 
                              onChange={(e) => {
                                const newTitle = e.target.value;
                                setTempScans(prev => prev.map(s => s.id === scan.id ? { ...s, title: newTitle } : s));
                              }}
                              placeholder="Подпись (Лицевая сторона...)"
                              className="w-full px-2.5 py-1 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                            />
                          </div>

                          <div className="flex items-center gap-1">
                            <label className="p-1.5 text-slate-400 hover:text-blue-400 rounded-lg cursor-pointer">
                              <i className="fa-solid fa-crop-simple"></i>
                              <input type="file" accept="image/*" onChange={(e) => handleFileSelect(e, scan.id)} className="hidden" />
                            </label>

                            <button 
                              type="button" 
                              onClick={() => setTempScans(prev => prev.filter(s => s.id !== scan.id))}
                              className="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg"

                    {editingDoc ? (
                      <button 
                        type="button" 
                        onClick={() => handleDeleteDoc(editingDoc.id)}
                        className="text-xs text-rose-400 hover:text-rose-300 font-medium"
                      >
                        <i className="fa-solid fa-trash-can mr-1"></i> Удалить
                      </button>
                    ) : <div />}

                    <div className="flex gap-2">
                      <button type="button" onClick={() => setIsDocModalOpen(false)} className="px-4 py-2 text-xs text-slate-400">Отмена</button>
                      <button type="submit" className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold shadow-md">Сохранить</button>
                    </div>
                  </div>

              </div>

          {/* EDIT MEMBER MODAL */}
          {isMemberModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl">
                <h3 className="font-bold text-slate-100 mb-4 text-base">
                  {editingMember ? 'Редактировать профиль' : 'Новый член семьи'}
                </h3>
                <form onSubmit={handleSaveMember} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Имя *</label>
                    <input 
                      type="text" 
                      name="name"
                      defaultValue={editingMember?.name || ''}
                      required 
                      placeholder="например, Мария"
                      className="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Роль / Родство</label>
                    <input 
                      type="text" 
                      name="role"
                      defaultValue={editingMember?.role || ''}
                      placeholder="например, Жена, Сын, Мама"
                      className="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="flex justify-between items-center pt-3 border-t border-slate-800">
                    {editingMember ? (
                      <button type="button" onClick={() => handleDeleteMember(editingMember.id)} className="text-xs text-rose-400">Удалить</button>
                    ) : <div />}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setIsMemberModalOpen(false)} className="px-3.5 py-1.5 text-xs text-slate-400">Отмена</button>
                      <button type="submit" className="px-4 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-semibold">Сохранить</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* BACKUP MODAL */}
          {isBackupModalOpen && (
            <BackupModal 
              onClose={() => setIsBackupModalOpen(false)}
              onExport={handleExportBackup}
              onImport={handleImportBackup}
            />
          )}

        </div>
      );
    }

    // --- CROPPER COMPONENT ---
    function CropperModal({ imageSrc, onCancel, onSave }) {
      const [rotation, setRotation] = useState(0);
      const [contrast, setContrast] = useState(100);
      const [brightness, setBrightness] = useState(100);
      const [isBW, setIsBW] = useState(false);
      const canvasRef = useRef(null);

      useEffect(() => {
        renderCanvas();
      }, [rotation, contrast, brightness, isBW, imageSrc]);

      const renderCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          let w = img.width;
          let h = img.height;

          if (rotation % 180 !== 0) {
            canvas.width = h;
            canvas.height = w;
          } else {
            canvas.width = w;
            canvas.height = h;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate((rotation * Math.PI) / 180);
          ctx.filter = `contrast(${contrast}%) brightness(${brightness}%) ${isBW ? 'grayscale(100%)' : ''}`;
          ctx.drawImage(img, -w / 2, -h / 2);
          ctx.restore();
        };
        img.src = imageSrc;
      };

      const handleSave = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        onSave(canvas.toDataURL('image/jpeg', 0.85));
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex flex-col p-4">
          <div className="flex justify-between items-center text-white mb-2">
            <h3 className="font-bold text-sm">Редактор скана</h3>
            <button onClick={onCancel} className="p-1.5 text-slate-400 hover:text-white bg-slate-800 rounded-xl">
              <i className="fa-solid fa-xmark text-lg"></i>
            </button>
          </div>

          <div className="flex-1 flex items-center justify-center overflow-hidden my-2 bg-slate-900 rounded-2xl border border-slate-800 p-2">
            <canvas ref={canvasRef} className="max-h-full max-w-full object-contain rounded-lg shadow-2xl" />
          </div>

          <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-3 text-xs">
              <button 
                type="button" 
                onClick={() => setRotation(r => (r + 90) % 360)}
                className="px-3 py-1.5 bg-slate-800 text-slate-200 rounded-xl flex items-center gap-1.5"
              >
                <i className="fa-solid fa-rotate-right"></i> Повернуть 90°
              </button>

              <button 
                type="button" 
                onClick={() => setIsBW(b => !b)}
                className={`px-3 py-1.5 rounded-xl border flex items-center gap-1.5 ${
                  isBW ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'
                }`}
              >
                <i className="fa-solid fa-wand-magic-sparkles"></i> Ч/Б Скан
              </button>
            </div>

            <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
              <button type="button" onClick={onCancel} className="px-4 py-1.5 text-xs text-slate-400">Отмена</button>
              <button type="button" onClick={handleSave} className="px-5 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-md">Готово</button>
            </div>
          </div>
        </div>
      );
    }

    // --- BACKUP MODAL COMPONENT ---
    function BackupModal({ onClose, onExport, onImport }) {
      const [passExport, setPassExport] = useState('');
      const [passImport, setPassImport] = useState('');
      const [importFile, setImportFile] = useState(null);

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <h3 className="font-bold text-slate-100 text-sm">
                <i className="fa-solid fa-arrows-rotate text-blue-400 mr-2"></i> Резервная копия (Бэкап)
              </h3>
              <button onClick={onClose} className="text-slate-500 hover:text-white">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="p-3.5 bg-slate-950 rounded-2xl border border-slate-800 space-y-2">
              <h4 className="text-xs font-bold text-slate-200">Экспорт бэкапа</h4>
              <p className="text-[11px] text-slate-400">Сохранить все документы и сканы в файл.</p>
              
              <input 
                type="password" 
                value={passExport}
                onChange={(e) => setPassExport(e.target.value)}
                placeholder="Пароль для шифрования (опционально)"
                className="w-full px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
              />

              <button 
                onClick={() => onExport(passExport)}
                className="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition"
              >
                Скачать JSON-файл бэкапа
              </button>
            </div>

            <div className="p-3.5 bg-slate-950 rounded-2xl border border-slate-800 space-y-2">
              <h4 className="text-xs font-bold text-slate-200">Импорт на гаджет</h4>
              <p className="text-[11px] text-slate-400">Загрузить файл бэкапа с другого устройства.</p>
              
              <input 
                type="file" 
                accept=".json"
                onChange={(e) => setImportFile(e.target.files[0])}
                className="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:bg-slate-800 file:text-slate-200"
              />

              <input 
                type="password" 
                value={passImport}
                onChange={(e) => setPassImport(e.target.value)}
                placeholder="Пароль (если бэкап зашифрован)"
                className="w-full px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
              />

              <button 
                disabled={!importFile}
                onClick={() => onImport(importFile, passImport)}
                className="w-full py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 rounded-xl text-xs font-semibold transition"
              >
                Импортировать
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Render App inside Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
